<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Hybrid Combative mark. Redrawn as vector from the supplied reference so it
    stays sharp at every icon size and carries no baked-in background — the
    black here is a real fill we control, not screenshot matte.

    Three parts: two crescent horns, an angular skull that converges to a point,
    and two raked eyes. Everything is a hard edge; no curve softer than the
    horn sweep, which is the only organic line the brand allows.
  -->
  <rect width="512" height="512" fill="#0B0B0B"/>

  <g fill="#FFA51E">
    <!-- horns: thick at the skull, tapering to a point, sweeping up and out -->
    <path d="M182 188 C132 176 100 138 96 78 C74 140 82 200 132 238 Z"/>
    <path d="M330 188 C380 176 412 138 416 78 C438 140 430 200 380 238 Z"/>
  </g>

  <!-- skull: flat crown, flared cheeks, single point at the chin -->
  <path
    d="M186 176 L326 176 L366 268 L256 410 L146 268 Z"
    fill="#0B0B0B"
    stroke="#FFA51E"
    stroke-width="34"
    stroke-linejoin="miter"
  />

  <!-- eyes: raked inward and down. The angle is the whole expression. -->
  <g fill="#E4340E">
    <path d="M196 250 L244 272 L238 292 L192 268 Z"/>
    <path d="M316 250 L268 272 L274 292 L320 268 Z"/>
  </g>
</svg>
